<script>
(function () {
  var root = document.getElementById('forensics-investigations');
  if (!root) return;
  var table = root.querySelector('[data-investigations-table]');
  var status = root.querySelector('[data-investigations-status]');
  var errorBox = root.querySelector('[data-investigations-error]');
  var sort = document.getElementById('forensics-sort');
  var page = 1, generation = 0, active = null, runToken = 0;
  var drafts = new Map();
  var latest = new Map();
  function esc(value) {
    return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fail(error) { errorBox.textContent = error.message || String(error); errorBox.hidden = false; }
  async function api(path, body) {
    var options = {credentials:'same-origin',cache:'no-store',headers:{'Accept':'application/json'}};
    if (body !== undefined) {options.method='POST'; options.headers['Content-Type']='application/json'; options.body=JSON.stringify(body);}
    var response = await fetch('/admin/killmail-forensics/' + path, options);
    var data = await window.forensicsResponse(response);
    if (!response.ok) throw new Error(data.error || 'The request failed.');
    return data;
  }
  function picker(c,side,key) {
    var choices = (drafts.get(c.id) || c.choices)[key];
    var info = c.hypotheses[side];
    var listed = new Set(info.candidates.map(function(candidate){return candidate.id;}));
    var manual = choices.filter(function(id){return id!==null && !listed.has(id);}).join(', ');
    var rows = info.candidates.map(function (candidate) {
      var id = candidate.id === null ? 'none' : candidate.id;
      var checked = choices.includes(candidate.id);
      var title = candidate.reasons.join('\n');
      return '<label class="d-block mb-1 small" title="'+esc(title)+'"><input type="checkbox" data-choice="'+key+'" value="'+id+'" '+(checked?'checked ':'')+(active?'disabled ':'')+'> '+candidate.rank+'. '+esc(candidate.name)+(candidate.id!==null && key!=='ids'?' <span class="muted-line">#'+candidate.id+'</span>':'')+' <span class="text-info">'+candidate.score+'%</span></label>';
    }).join('');
    var best=info.candidates[0];
    return (best?'<div class="small mb-1" title="'+esc(best.reasons.join('\n'))+'">'+esc(best.name)+' · '+best.score+'%</div>':'')+
      '<details><summary>'+choices.length+' selected / '+info.candidates.length+' hypotheses</summary>'+
      (info.truncated?'<div class="text-warning small">Candidate coverage is incomplete.</div>':'')+
      '<div style="max-height:260px;overflow:auto">'+rows+'</div></details>'+
      '<label class="small d-block mt-2">Add '+(key==='ids'?'killmail':'character')+' IDs <input class="form-control form-control-sm" data-manual="'+key+'" value="'+esc(manual)+'" placeholder="123, 456" '+(active?'disabled':'')+'></label>';
  }
  function estimate(c) {
    var f=c.forecast;
    if(!f)return '<span class="muted-line">Awaiting analysis</span>';
    var names={strong:'Strong evidence',moderate:'Moderate evidence',weak:'Weak evidence',blocked:'Needs input',exhausted:'Selected plan exhausted',confirmed:'Confirmed'};
    var count=f.typical_trials===null?'Not estimated':f.typical_trials+'–'+f.upper_trials+' trials';
    return '<div data-forecast title="'+esc(f.reasons.join('\n'))+'"><strong>'+esc(count)+'</strong><div class="small">'+esc(names[f.assessment] || f.assessment)+'</div></div>'+
      (c.refresh_pending?'<div class="small text-info">Neighbor recalculation queued</div>':'');
  }
  function render(cases) {
    root.querySelector('[data-investigations-stop]').hidden=active===null;
    latest = new Map(cases.map(function (c) {return [c.id,c];}));
    var rows = cases.map(function (c) {
      var s=c.snapshot, h=c.hypotheses;
      var inferred=h.ids.deduced?'Deduced ID':'Candidate IDs';
      return '<tr data-case="'+c.id+'"><td><strong>'+inferred+'</strong>'+picker(c,'ids','ids')+
        '<div class="muted-line small mt-2">MER '+esc(c.source_month)+' · row '+c.source_row+'</div>'+ 
        (h.ids.truncated?'<div class="text-warning small">'+h.ids.total+' IDs possible; showing '+h.ids.candidates.length+'. Add more IDs manually.</div>':'')+'</td>'+
        '<td><a href="/kill/mer/'+esc(c.source_month)+'/'+c.source_row+'/hidden?kill_datetime='+encodeURIComponent(c.kill_datetime)+'">'+esc(s.victim_ship_type_name || 'Type '+s.victim_ship_type_id)+'</a><div class="small">Victim ship type '+s.victim_ship_type_id+'</div><div>'+esc(c.kill_datetime)+' (UTC)</div><div class="small muted-line">'+esc(s.solar_system_name || 'System '+s.solar_system_id)+'</div><div class="small">Victim corp '+esc(s.victim_corporation_name || s.victim_corporation_id || 'unknown')+' · Final blow corp '+esc(s.killer_corporation_name || s.killer_corporation_id || 'unknown')+'</div></td>'+
        '<td>'+picker(c,'victim','victims')+'</td><td>'+picker(c,'attacker','attackers')+'</td>'+
        '<td>'+estimate(c)+'</td><td><strong data-remaining>'+(c.status==='needs_input'?'Not estimated':c.estimated_attempts)+'</strong><div class="small muted-line">'+c.attempted+' stored tests</div><div class="badge text-bg-secondary">'+esc(c.status)+'</div>'+
        (h.warnings.length?'<details class="small text-warning"><summary>Evidence limits</summary>'+h.warnings.map(esc).join('<br>')+'</details>':'')+'</td>'+
        '<td><button type="button" class="btn btn-sm btn-outline-primary mb-1" data-case-action="save" '+(active?'disabled':'')+'>Apply choices</button> '+
        '<button type="button" class="btn btn-sm btn-primary mb-1" data-case-action="validate" '+(active?'disabled':'')+'>Test selected</button> '+
        '<button type="button" class="btn btn-sm btn-outline-light mb-1" data-case-action="refresh" '+(active?'disabled':'')+'>Refresh hypotheses</button>'+ 
        (active===c.id?' <button type="button" class="btn btn-sm btn-outline-danger" data-case-action="stop">Stop</button>':'')+'</td></tr>';
    }).join('');
    table.innerHTML='<table class="table align-middle"><thead><tr><th>MER / CCP ID</th><th>Known hash inputs</th><th>Victim hypotheses</th><th>Final blow hypotheses</th><th>Estimated search / outlook</th><th>Maximum attempts remaining</th><th>Actions</th></tr></thead><tbody>'+
      (rows || '<tr><td colspan="7" class="muted-line">No saved investigations match these filters. Start the background analysis above, or investigate selected hidden killmails below.</td></tr>')+'</tbody></table>';
    root.querySelector('[data-investigations-prev]').disabled=page===1;
    root.querySelector('[data-investigations-next]').disabled=cases.length<50;
  }
  async function load() {
    var current=++generation;
    root.setAttribute('aria-busy','true');
    try {
      var params=new URLSearchParams({sort:sort.value,page:page,assessment:root.querySelector('[data-assessment-filter]').value,evidence_role:root.querySelector('[data-evidence-role]').value});
      root.querySelectorAll('[data-evidence-filter]:checked').forEach(function(box){params.append('evidence',box.value);});
      var data=await api('cases?'+params.toString());
      if(current===generation) render(data.cases);
    } finally {
      if(current===generation) root.setAttribute('aria-busy','false');
    }
  }
  function rowChoices(row) {
    var choices={ids:[],victims:[],attackers:[]};
    row.querySelectorAll('[data-choice]:checked').forEach(function(box){choices[box.dataset.choice].push(box.value==='none'?null:Number(box.value));});
    row.querySelectorAll('[data-manual]').forEach(function(input){
      if (!input.value.trim()) return;
      input.value.split(',').forEach(function(text){
        var trimmed=text.trim();
        var id=Number(trimmed);
        if(!/^\d+$/.test(trimmed)||!Number.isSafeInteger(id)||id<=0) throw new Error('Enter positive IDs separated by commas.');
        if(!choices[input.dataset.manual].includes(id)) choices[input.dataset.manual].push(id);
      });
    });
    return choices;
  }
  async function save(row) {
    var id=Number(row.dataset.case), choices=rowChoices(row);
    var updated=await api('cases/'+id+'/choices',choices);
    drafts.delete(id); latest.set(id,updated);
    return updated;
  }
  async function validate(id,token) {
    try {
      while(token===runToken) {
        var data=await api('cases/'+id+'/validate',{});
        await load();
        if(token!==runToken) break;
        status.textContent=data.neighbor_refresh_error?'Killmail confirmed. Neighbor queueing failed; see job/server logs.':data.message || (data.recovered?'Killmail confirmed by CCP. See Recovered killmails.':'Hypothesis checked.');
        if(data.done || data.paused) break;
        var remaining=Math.max(1,Number(data.retry_after)||2);
        while(remaining>0 && token===runToken) {
          status.textContent=(data.message || 'Continuing validation.')+' Next check in '+remaining+'s.';
          await new Promise(function(resolve){setTimeout(resolve,1000);}); remaining--;
        }
      }
    } catch(error){fail(error);}
    finally {
      if(token===runToken){active=null;await load().catch(fail);}
    }
  }
  async function stopValidation() {
    runToken++;active=null;status.textContent='Validation stopped. Completed tests are kept.';
    await load().catch(fail);
  }
  function updateDraft(event,reportError) {
    var row=event.target.closest('[data-case]');
    if(!row)return;
    try {
      var choices=rowChoices(row); drafts.set(Number(row.dataset.case),choices);
      var count=choices.ids.length*choices.victims.length*choices.attackers.length;
      row.querySelector('[data-remaining]').textContent=count+' in draft';
      var forecast=row.querySelector('[data-forecast]');if(forecast)forecast.textContent='Apply choices to update estimate';
    }catch(error){if(reportError)fail(error);}
  }
  table.addEventListener('change',function(event){updateDraft(event,true);});
  table.addEventListener('input',function(event){if(event.target.matches('[data-manual]'))updateDraft(event,false);});
  table.addEventListener('click',async function(event){
    var button=event.target.closest('[data-case-action]'); if(!button)return;
    var row=button.closest('[data-case]'), id=Number(row.dataset.case), action=button.dataset.caseAction;
    errorBox.hidden=true;
    if(action==='stop'){await stopValidation();return;}
    button.disabled=true;
    try {
      if(action==='save'){await save(row);await load();status.textContent='Choices saved. Remaining attempts updated.';}
      if(action==='refresh'){await api('cases/'+id+'/refresh',{});await load();status.textContent='Evidence refreshed; your choices were kept.';}
      if(action==='validate'){
        var updated=await save(row);
        if(!updated.estimated_attempts)throw new Error('No remaining combinations. Add candidates or choose a different killmail.');
        active=id; var token=++runToken;await load();validate(id,token);
      }
    }catch(error){fail(error);button.disabled=false;}
  });
  document.addEventListener('forensics:investigate',async function(event){
    var refs=event.detail.references, button=document.querySelector('[data-forensics-investigate]');
    button.disabled=true;errorBox.hidden=true;var errors=0;
    for(var index=0;index<refs.length;index++){
      status.textContent='Building investigation '+(index+1)+' of '+refs.length+'…';
      try{await api('cases',refs[index]);}catch(error){errors++;fail(error);}
    }
    button.disabled=false;status.textContent=(refs.length-errors)+' investigations ready'+(errors?' · '+errors+' could not be analyzed.':'.');
    await load().catch(fail);root.scrollIntoView({behavior:'smooth',block:'start'});
  });
  root.querySelector('[data-assessment-filter]').addEventListener('change',function(){page=1;load().catch(fail);});
  root.querySelector('[data-evidence-role]').addEventListener('change',function(){page=1;load().catch(fail);});
  root.querySelectorAll('[data-evidence-filter]').forEach(function(box){box.addEventListener('change',function(){page=1;load().catch(fail);});});
  root.querySelector('[data-evidence-clear]').addEventListener('click',function(){root.querySelectorAll('[data-evidence-filter]').forEach(function(box){box.checked=false;});root.querySelector('[data-evidence-role]').value='either';root.querySelector('[data-assessment-filter]').value='';page=1;load().catch(fail);});
  document.addEventListener('forensics:estimates-updated',function(){if(!active)load().catch(fail);});
  sort.addEventListener('change',function(){page=1;load().catch(fail);});
  root.querySelector('[data-investigations-refresh]').addEventListener('click',function(){errorBox.hidden=true;load().catch(fail);});
  root.querySelector('[data-investigations-stop]').addEventListener('click',stopValidation);
  root.querySelector('[data-investigations-prev]').addEventListener('click',function(){page--;load().catch(fail);});
  root.querySelector('[data-investigations-next]').addEventListener('click',function(){page++;load().catch(fail);});
  load().catch(fail);
})();
</script>

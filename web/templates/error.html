<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status_code }} · {{ error_title }} · EVEOSINT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #080b10;
      --panel: rgba(17, 24, 39, 0.94);
      --border: rgba(148, 163, 184, 0.16);
      --muted: #94a3b8;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(13, 110, 253, 0.16), transparent 34%),
        radial-gradient(circle at bottom right, rgba(0, 255, 200, 0.07), transparent 30%),
        var(--bg);
      color: #e9eef5;
    }

    .error-card {
      width: min(620px, calc(100vw - 32px));
      padding: 38px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .error-code {
      color: #60a5fa;
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .error-card h1 {
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      margin-bottom: 12px;
    }

    .error-message {
      color: var(--muted);
      margin-bottom: 28px;
    }

    .error-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-code">Error {{ status_code }}</div>
    <h1>{{ error_title }}</h1>
    <p class="error-message">{{ error_message }}</p>

    <div class="error-actions">
      <button type="button" class="btn btn-outline-light" onclick="history.back()">Go back</button>
      <a class="btn btn-primary" href="/login">Login</a>
    </div>
  </main>
</body>
</html>

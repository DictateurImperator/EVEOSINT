<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),endpoint='/admin/debug/economy/',palette=['#52b8ff','#f6c85f','#e76f9b','#56c9a0','#aa8cf0','#ff9854','#d8e4ee'];
let catalog,chosen=new Set(),items=new Map(),currentId=null,timer,lastResult,generation=0;
const fmt=(value,digits=2)=>value===null?'—':Number(value).toLocaleString('en-US',{maximumFractionDigits:digits});
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
async function api(path,options={}){const r=await fetch(endpoint+path,{cache:'no-store',...options});if(r.redirected)throw Error('Session expired. Sign in again.');let data;try{data=await r.json();}catch(e){throw Error('Could not read the server response.');}if(!r.ok)throw Error(data.error||'Request failed.');return data;}
function status(text){$('ecoStatus').textContent=text;}
function renderPresets(){const q=$('presetSearch').value.toLowerCase(),box=$('ecoPresets');box.replaceChildren();for(const b of catalog.baskets.filter(b=>b.label.toLowerCase().includes(q))){const label=node('label',undefined,'d-flex gap-2 py-1'),check=node('input');check.type='checkbox';check.checked=chosen.has(b.key);check.addEventListener('change',()=>{if(check.checked&&chosen.size>=6){check.checked=false;status('Choose at most six built-in curves.');return;}check.checked?chosen.add(b.key):chosen.delete(b.key);});label.append(check,node('span',`${b.label} (${b.count} objects)`));box.append(label);}}
function renderItems(){const body=$('basketItems');body.replaceChildren();for(const [id,item] of items){const tr=node('tr'),td=node('td');td.append(node('span',item.name));const qty=node('input');qty.type='number';qty.min='0.00000001';qty.max='1000000000000';qty.step='any';qty.value=item.quantity;qty.className='form-control form-control-sm';qty.setAttribute('aria-label',`Quantity of ${item.name}`);qty.addEventListener('input',()=>item.quantity=qty.value);const cell=node('td');cell.append(qty);const remove=node('button','×','btn btn-sm btn-outline-danger');remove.type='button';remove.setAttribute('aria-label',`Remove ${item.name}`);remove.onclick=()=>{items.delete(id);renderItems();};const action=node('td');action.append(remove);tr.append(td,cell,action);body.append(tr);}}
$('presetSearch').oninput=()=>catalog&&renderPresets();
$('itemSearch').oninput=()=>{const box=$('itemResults'),q=$('itemSearch').value.trim().toLowerCase();box.replaceChildren();if(!catalog||q.length<2)return;for(const item of catalog.items.filter(i=>i.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,12)){const button=node('button',`${item.name} · ${item.group}`,'list-group-item list-group-item-action');button.type='button';button.onclick=()=>{if(!items.has(item.id)&&items.size>=100){status('Maximum 100 custom objects.');return;}if(!items.has(item.id))items.set(item.id,{...item,quantity:'1'});renderItems();box.replaceChildren();$('itemSearch').value='';};box.append(button);}};
const storageKey='eveosint.economic-baskets.v1';
function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]');}catch(e){return [];}}
function savedList(){const select=$('savedBaskets');select.replaceChildren(node('option','Saved baskets…'));select.firstChild.value='';saved().forEach((basket,index)=>{const option=node('option',basket.name);option.value=String(index);select.append(option);});}
$('saveBasket').onclick=()=>{const name=$('basketName').value.trim();if(!name||!items.size){status('Name your basket and add at least one object.');return;}const all=saved().filter(b=>b.name!==name);all.push({name,items:[...items].map(([id,item])=>({id,quantity:item.quantity}))});try{localStorage.setItem(storageKey,JSON.stringify(all));savedList();status('Basket saved in this browser.');}catch(e){status('Browser storage is unavailable or full.');}};
$('savedBaskets').onchange=()=>{const basket=saved()[Number($('savedBaskets').value)];if(!basket||$('savedBaskets').value==='')return;items.clear();let missing=0;for(const row of basket.items){const item=catalog.items.find(i=>i.id===row.id);if(item)items.set(row.id,{...item,quantity:row.quantity});else missing++;}$('basketName').value=basket.name;renderItems();if(missing)status(`${missing} objects are no longer available in the SDE and were not loaded.`);};
$('deleteBasket').onclick=()=>{const value=$('savedBaskets').value;if(value==='')return;try{localStorage.setItem(storageKey,JSON.stringify(saved().filter((_,index)=>index!==Number(value))));savedList();status('Saved basket deleted.');}catch(e){status('Browser storage unavailable.');}};
function table(headers,rows){const table=node('table',undefined,'table table-sm align-middle'),head=node('thead'),tr=node('tr');for(const h of headers)tr.append(node('th',h));head.append(tr);table.append(head);const body=node('tbody');for(const row of rows){const r=node('tr');for(const value of row)r.append(node('td',value));body.append(r);}table.append(body);return table;}
function chart(result){
 const host=$('ecoChart');host.replaceChildren();const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1000 360');svg.style.width='100%';svg.style.minWidth='600px';host.style.overflowX='auto';svg.setAttribute('role','img');svg.setAttribute('aria-label','Fixed basket price indices; reference equals 100 percent');
 function el(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attrs||{}))n.setAttribute(key,value);if(text!==undefined)n.textContent=text;svg.append(n);return n;}
 const valid=result.series.flatMap(s=>s.points.filter(p=>p.index!==null));if(!valid.length){host.append(node('p','No basket has a usable reference price. See missing prices below.'));return;}
 const dates=result.series[0].points.map(p=>Date.parse(p.date)),min=Math.min(...dates),max=Math.max(...dates),values=valid.map(p=>p.index),low=Math.max(0,Math.min(80,...values)*.9),high=Math.max(120,...values)*1.05;
 const x=d=>65+(Date.parse(d)-min)/(max-min||1)*910,y=v=>310-(v-low)/(high-low)*275;
 for(let i=0;i<=5;i++){const v=low+(high-low)*i/5;el('line',{x1:65,x2:975,y1:y(v),y2:y(v),stroke:'#344354'});el('text',{x:57,y:y(v)+4,'text-anchor':'end',fill:'#afc1d4','font-size':12},fmt(v,0)+'%');}
 el('line',{x1:65,x2:975,y1:y(100),y2:y(100),stroke:'#e0e7ef','stroke-dasharray':'6 5'});
 for(const at of [...new Set([result.series[0].points[0].date,result.reference,result.end])])el('text',{x:x(at),y:340,'text-anchor':at===result.end?'end':'start',fill:'#afc1d4','font-size':12},at);
 result.series.forEach((s,index)=>{let path='';let connected=false;for(const p of s.points){if(p.index===null){connected=false;continue;}path+=(connected?'L':'M')+x(p.date)+','+y(p.index)+' ';connected=true;}el('path',{d:path,fill:'none',stroke:palette[index], 'stroke-width':2.5});for(const p of s.points.filter(p=>p.index!==null)){const circle=el('circle',{cx:x(p.date),cy:y(p.index),r:3,fill:palette[index],tabindex:0});const title=document.createElementNS(ns,'title');title.textContent=`${s.name} · ${p.date}: ${fmt(p.index)}% · ${fmt(p.cost)} ISK · ${p.carried} carried quotes`;circle.append(title);}});
 host.append(svg);result.series.forEach((s,index)=>{const label=node('span',s.name,'d-inline-block me-3 small');label.style.color=palette[index];host.append(label);});
}
function render(result){lastResult=result;$('ecoResults').hidden=false;chart(result);const summary=$('ecoSummary');summary.replaceChildren(table(['Basket','Objects with reference price','Reference cost (ISK)','End cost (ISK)','Index','Change'],result.series.map(s=>{const end=s.points.at(-1);return [s.name,`${s.included} / ${s.requested}`,fmt(s.base_cost),fmt(end.cost),fmt(end.index)+'%',end.index===null?'—':(end.index>=100?'+':'')+fmt(end.index-100)+'%'];})));
 const values=$('ecoValues');values.replaceChildren(table(['Date (UTC)',...result.series.map(s=>s.name+' (%)')],result.series[0].points.map((p,index)=>[p.date,...result.series.map(s=>fmt(s.points[index].index))])));
 const details=$('ecoDetails');details.replaceChildren();for(const s of result.series){details.append(node('h3',s.name,'h6 mt-3'));if(s.excluded.length)details.append(node('p',`${s.excluded.length} objects excluded for the entire curve: no positive quote on or before the reference. This curve represents only the ${s.included} priced objects.`,'text-warning small'));const stale=s.items.filter(i=>i.included&&i.end_quote_date&&i.end_quote_date<result.end).length;if(stale)details.append(node('p',`${stale} objects use an earlier quote at the end date; check its age below.`,'muted-line small'));const wrap=node('div',undefined,'table-responsive');wrap.style.maxHeight='420px';wrap.style.overflow='auto';wrap.append(table(['Object','Quantity','In fixed basket','Reference price','Reference quote date','End price','End quote date','Change'],s.items.map(i=>[i.name,i.quantity,i.included?'Yes':'Excluded',fmt(i.base_price,8),i.base_quote_date||'Missing',fmt(i.end_price,8),i.end_quote_date||'Missing',i.change===null?'—':fmt(i.change)+'%'])));details.append(wrap);}}
$('exportIndices').onclick=()=>{if(!lastResult)return;const escape=value=>{let s=String(value??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const rows=[['Date UTC',...lastResult.series.map(s=>s.name+' index (%)')],...lastResult.series[0].points.map((p,index)=>[p.date,...lastResult.series.map(s=>s.points[index].index)])];const url=URL.createObjectURL(new Blob([rows.map(row=>row.map(escape).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=node('a');a.href=url;a.download='eveosint-economic-indices.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
async function poll(id,version){if(version!==generation)return;try{const data=await api('status/'+id);if(version!==generation)return;const p=data.progress||{};status(`${data.status} · ${p.phase||'Starting'} · ${p.checked||0} / ${p.total||0}${p.month?' · '+p.month:''}`);$('ecoProgress').hidden=data.status!=='running';$('ecoProgress').max=p.total||1;$('ecoProgress').value=p.checked||0;if(data.status==='running'){timer=setTimeout(()=>poll(id,version),1500);return;}$('ecoStop').hidden=true;if(data.status==='completed')render(data.result);else status(data.error||data.status);}catch(e){status(e.message);$('ecoStop').hidden=true;}}
$('economicForm').onsubmit=async event=>{event.preventDefault();clearTimeout(timer);const version=++generation;status('Starting price scan…');$('ecoResults').hidden=true;try{const data=await api('calculate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:$('ecoStart').value,base:$('ecoBase').value,end:$('ecoEnd').value,presets:[...chosen],name:$('basketName').value,items:[...items].map(([id,item])=>({id,quantity:item.quantity}))})});if(version!==generation)return;currentId=data.id;$('ecoStop').hidden=false;poll(data.id,version);}catch(e){status(e.message);}};
$('ecoStop').onclick=async()=>{if(!currentId)return;try{await api('stop/'+currentId,{method:'POST'});clearTimeout(timer);generation++;status('Calculation cancelled.');$('ecoStop').hidden=true;$('ecoProgress').hidden=true;}catch(e){status(e.message);}};
api('catalog').then(data=>{catalog=data;renderPresets();savedList();if(!data.first||!data.last){status('No local price history. Import it before calculating.');return;}$('ecoAvailability').textContent=`Local quotes: ${data.first} → ${data.last}`;const last=new Date(data.last+'T00:00:00Z');last.setUTCFullYear(last.getUTCFullYear()-1);const base=last.toISOString().slice(0,10)<data.first?data.first:last.toISOString().slice(0,10);for(const id of ['ecoStart','ecoBase','ecoEnd']){$(id).min=data.first;$(id).max=data.last;}$('ecoStart').value=base;$('ecoBase').value=base;$('ecoEnd').value=data.last;for(const b of data.baskets)if(['Subcapital','Capital','Supercapital','Triglavian'].includes(b.label))chosen.add(b.key);renderPresets();$('ecoCalculate').disabled=false;}).catch(e=>status(e.message));
})();
</script>

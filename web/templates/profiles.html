{% extends "base.html" %}

{% block content %}
<style>
  .profiles-search-shell {
    max-width: 980px;
    margin: 7vh auto 0;
  }
  .profiles-search-title {
    font-size: clamp(2rem, 4vw, 4rem);
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .profiles-search-box {
    position: relative;
  }
  .profiles-search-input {
    height: 68px;
    font-size: 1.35rem;
    border-radius: 22px;
    padding-left: 1.35rem;
    padding-right: 1.35rem;
  }
  .profiles-search-results {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    z-index: 1000;
    background: #0b1220;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    overflow-y: auto;
    max-height: min(680px, calc(100vh - 180px));
    display: none;
  }
  .profiles-search-results.show {
    display: block;
  }
  .profiles-search-section + .profiles-search-section {
    border-top: 1px solid rgba(148, 163, 184, 0.20);
  }
  .profiles-search-section-title {
    padding: 8px 13px;
    background: rgba(255, 255, 255, 0.055);
    color: #cbd5e1;
    font-size: .72rem;
    line-height: 1;
    font-weight: 800;
    letter-spacing: .035em;
  }
  .profiles-search-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .profiles-search-result {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    color: #e5eefb;
    text-decoration: none;
    border-right: 1px solid rgba(148, 163, 184, 0.07);
    border-bottom: 1px solid rgba(148, 163, 184, 0.07);
  }
  .profiles-search-result:hover,
  .profiles-search-result.active {
    background: rgba(13, 110, 253, 0.45);
    color: #fff;
  }
  .profiles-search-result img,
  .profiles-search-fallback-icon {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border-radius: 6px;
    object-fit: cover;
    background: rgba(255,255,255,0.06);
  }
  .profiles-search-fallback-icon {
    display: grid;
    place-items: center;
    color: #8bd3ff;
    border: 1px solid rgba(148, 163, 184, .28);
    font-weight: 800;
    font-size: 1.1rem;
  }
  .profiles-search-fallback-icon.system::before { content: "◎"; }
  .profiles-search-fallback-icon.constellation::before { content: "✣"; }
  .profiles-search-fallback-icon.region::before { content: "⬡"; }
  .profiles-search-fallback-icon.ship::before { content: "✦"; }
  .profiles-search-fallback-icon.ship_group::before { content: "◈"; }

  .profiles-search-text {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .profiles-search-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 800;
    line-height: 1.15;
  }
  .profiles-search-type {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: .78rem;
    line-height: 1.1;
    margin-top: 3px;
  }

  @media (max-width: 900px) {
    .profiles-search-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 560px) {
    .profiles-search-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<section class="profiles-search-shell">
  <div class="text-center mb-4">
    <h1 class="profiles-search-title mb-2">Profiles</h1>
    <div class="muted-line">Search characters, corporations, alliances, ships or locations.</div>
  </div>

  <div class="profiles-search-box" data-profiles-search>
    <input
      class="form-control profiles-search-input"
      data-profiles-search-input
      type="search"
      placeholder="Search entity..."
      aria-label="Search entity"
      autocomplete="off"
      autofocus>
    <div class="profiles-search-results" data-profiles-search-results></div>
  </div>
</section>

<script>
  (() => {
    const root = document.querySelector("[data-profiles-search]");
    if (!root) {
      throw new Error("Profiles search root missing");
    }

    const input = root.querySelector("[data-profiles-search-input]");
    const resultsBox = root.querySelector("[data-profiles-search-results]");
    if (!input || !resultsBox) {
      throw new Error("Profiles search targets missing");
    }

    let debounceTimer = null;
    let lastResults = [];
    let selectedIndex = -1;
    let lastQueryId = 0;

    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

    const showBox = () => resultsBox.classList.add("show");
    const hideBox = () => resultsBox.classList.remove("show");

    const clearResults = () => {
      lastResults = [];
      selectedIndex = -1;
      resultsBox.innerHTML = "";
      hideBox();
    };

    const normalizeResults = (payload) => {
      const raw = payload && Array.isArray(payload.results) ? payload.results : [];
      return raw
        .map((item) => ({
          label: item.label || item.name || "Unknown",
          subtitle: item.subtitle || item.entity_type || "Entity",
          url: item.url || "",
          image_url: item.image_url || "",
          entity_type: item.entity_type || "entity",
          section: item.section || String(item.entity_type || "ENTITY").toUpperCase(),
        }))
        .filter((item) => item.url);
    };

    const renderResults = (items) => {
      lastResults = items || [];
      selectedIndex = -1;

      if (!lastResults.length) {
        resultsBox.innerHTML = '<div class="px-3 py-3 muted-line">No result</div>';
        showBox();
        return;
      }

      const groups = [];
      const bySection = new Map();
      lastResults.forEach((item, index) => {
        if (!bySection.has(item.section)) {
          const group = {section: item.section, items: []};
          bySection.set(item.section, group);
          groups.push(group);
        }
        bySection.get(item.section).items.push({item, index});
      });

      resultsBox.innerHTML = groups.map((group) => `
        <section class="profiles-search-section">
          <div class="profiles-search-section-title">${escapeHtml(group.section)}</div>
          <div class="profiles-search-grid">
            ${group.items.map(({item, index}) => `
              <a class="profiles-search-result" href="${escapeHtml(item.url)}" data-index="${index}">
                ${item.image_url
                  ? `<img src="${escapeHtml(item.image_url)}" alt="" loading="lazy" onerror="this.style.display='none'">`
                  : `<span class="profiles-search-fallback-icon ${escapeHtml(item.entity_type)}" aria-hidden="true"></span>`}
                <span class="profiles-search-text">
                  <span class="profiles-search-name">${escapeHtml(item.label)}</span>
                  <span class="profiles-search-type">${escapeHtml(item.subtitle)}</span>
                </span>
              </a>
            `).join("")}
          </div>
        </section>
      `).join("");

      resultsBox.querySelectorAll(".profiles-search-result").forEach((node) => {
        node.addEventListener("mousedown", (event) => {
          event.preventDefault();
          window.location.href = node.getAttribute("href");
        });
      });

      showBox();
    };

    const setActive = () => {
      resultsBox.querySelectorAll(".profiles-search-result").forEach((node, index) => {
        node.classList.toggle("active", index === selectedIndex);
      });
    };

    const searchProfiles = async (limit) => {
      const q = input.value.trim();
      if (!q) {
        clearResults();
        return [];
      }

      const queryId = ++lastQueryId;
      const url = `/api/entity-search?q=${encodeURIComponent(q)}&limit=${encodeURIComponent(limit)}&scope=global`;

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: {"Accept": "application/json"},
          credentials: "same-origin",
          cache: "no-store",
        });

        if (queryId !== lastQueryId) return [];

        const text = await response.text();
        if (!response.ok) {
          resultsBox.innerHTML = '<div class="px-3 py-3 text-danger">Erreur 500</div>';
          showBox();
          return [];
        }

        let payload = {};
        try {
          payload = JSON.parse(text || "{}");
        } catch (error) {
          resultsBox.innerHTML = '<div class="px-3 py-3 text-danger">Erreur 500</div>';
          showBox();
          return [];
        }

        return normalizeResults(payload);
      } catch (error) {
        if (queryId !== lastQueryId) return [];
        resultsBox.innerHTML = '<div class="px-3 py-3 text-danger">Erreur 500</div>';
        showBox();
        return [];
      }
    };

    const refreshSuggestions = async () => {
      const items = await searchProfiles(8);
      renderResults(items);
    };

    const scheduleSuggestions = () => {
      window.clearTimeout(debounceTimer);
      if (!input.value.trim()) {
        clearResults();
        return;
      }
      debounceTimer = window.setTimeout(refreshSuggestions, 250);
    };

    const goToSelectedOrFirst = async () => {
      window.clearTimeout(debounceTimer);

      if (lastResults.length) {
        const index = selectedIndex >= 0 ? selectedIndex : 0;
        window.location.href = lastResults[index].url;
        return;
      }

      const items = await searchProfiles(1);
      if (items.length) {
        window.location.href = items[0].url;
        return;
      }
      renderResults([]);
    };

    input.addEventListener("input", scheduleSuggestions);
    input.addEventListener("focus", () => {
      if (lastResults.length) showBox();
      else if (input.value.trim()) scheduleSuggestions();
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        clearResults();
        return;
      }
      if (event.key === "ArrowDown") {
        if (!lastResults.length) return;
        event.preventDefault();
        selectedIndex = Math.min(selectedIndex + 1, lastResults.length - 1);
        setActive();
        return;
      }
      if (event.key === "ArrowUp") {
        if (!lastResults.length) return;
        event.preventDefault();
        selectedIndex = Math.max(selectedIndex - 1, 0);
        setActive();
        return;
      }
      if (event.key === "Enter") {
        event.preventDefault();
        goToSelectedOrFirst();
      }
    });

    document.addEventListener("click", (event) => {
      if (!root.contains(event.target)) hideBox();
    });
  })();
</script>
{% endblock %}

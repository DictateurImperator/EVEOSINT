{% include 'killboard_filters.html' %}
<section class="content-card p-3"><h2 class="h5">Killboard</h2><div id="publicShipKills" data-url="/api/ship/{{ profile.entity_id }}/killmails">Loading killmails…</div></section>
<script>
(() => {
 const root=document.getElementById('publicShipKills');
 const filters=document.querySelector('[data-killboard-filters]');
 let params=new URLSearchParams(location.search),active;
 params.delete('tab');
 async function load(page='1') {
  active?.abort();active=new AbortController();params.set('page',page);
  root.textContent='Loading killmails…';
  try {const response=await fetch(root.dataset.url+'?'+params,{signal:active.signal});
   if(!response.ok)throw new Error('Killmails could not be loaded. Please retry.');
   root.innerHTML=await response.text();
  }catch(e){if(e.name!=='AbortError')root.textContent=e.message;}
 }
 root.addEventListener('click',event=>{
  const button=event.target.closest('[data-killmail-page],[data-killmail-mode],[data-killmail-participation]');
  if(!button)return;event.preventDefault();
  if(button.dataset.killmailPage){load(button.dataset.killmailPage);return;}
  if(button.dataset.killmailMode)params.set('mode',button.dataset.killmailMode);
  if(button.dataset.killmailParticipation)params.set('participation',button.dataset.killmailParticipation);
  load();
 });
 filters?.addEventListener('killboard:apply',event=>{params=new URLSearchParams(event.detail.params);load();});
 load(params.get('page')||'1');
})();
</script>

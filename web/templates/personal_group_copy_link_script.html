<script>(()=>{for(const button of document.querySelectorAll('[data-copy-public-link]'))button.onclick=async()=>{const box=button.closest('[data-public-link]'),input=box.querySelector('input'),status=box.querySelector('[data-copy-status]');try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(input.value);else{input.select();if(!document.execCommand('copy'))throw new Error();}status.textContent='Copied';}catch(e){input.focus();input.select();status.textContent='Select and copy this link.';}};})();</script>
